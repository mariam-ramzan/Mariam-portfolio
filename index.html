    <!-- Theme ko paint se pehle set karta hai — page flash nahi karta -->
    <script>
      (function () {
        var t = localStorage.getItem('portfolio-theme') || 'dark'
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(t)
      })()
    </script>
